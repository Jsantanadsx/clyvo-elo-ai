name: Python CI — regras e API

on:
  push:
    branches: [main, sprint4-ia-generativa, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Rodar testes sem chave OpenAI
        env:
          OPENAI_API_KEY: ''
          CLYVO_API_TOKEN: ''
          CLYVO_LOCAL_DEMO: 'false'
        run: python -m pytest -q
